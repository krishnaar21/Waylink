# Publishes to GitHub Pages when either web app changes on main:
# web/ (Waylink for desktop) at the site root, and web-v0/ (the design reference) under /v0/.
# Build and deploy are separate jobs (GitHub's own Pages template): the deploy job starts only
# once the uploaded site is fully registered, which avoids "No artifacts named github-pages" and
# deploys that hang waiting for a status.
name: Deploy web apps to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web-v0/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read   # deploy-pages looks up the uploaded artifact
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # never cut a deploy off half way
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together, without tests and tools
        run: |
          rm -rf web-v0/tests web-v0/tools web/tests web/tools
          mkdir _site && cp -r web/. _site/ && cp -r web-v0 _site/v0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
