  <script>
    // Safety net: if the app hasn't started within 8 s, or something breaks while starting, take the loader down
    // and say what happened, with a way to reload. Plain script, so it runs even if a module fails to load.

        d.innerHTML = '<b>Waylink didn’t start</b><span></span><button type="button">Reload</button><button type="button" class="ghost">Reset the app’s saved files</button>';
        d.querySelector('span').textContent = msg || 'It took too long to load. Check your connection and try again.';
        d.querySelector('button').onclick = function () { location.reload(); };
        d.querySelector('.ghost').onclick = function () {
          var done = function () { location.reload(); };

        };
        (document.getElementById('app') || document.body).appendChild(d);

      window.addEventListener('unhandledrejection', function (e) { if (!window.__waylinkReady) fail('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
