  <script>
    // Safety net: if the app hasn't started within 8 s, or something breaks while starting, take the loader down
    // and say what happened, with a way to reload. Plain script, so it runs even if a module fails to load.
    (function () {
      var t0 = Date.now(), shown = false;
      function fail(msg) {
        if (window.__waylinkReady || shown) return; shown = true;
        var sp = document.getElementById('splash'); if (sp) sp.remove();
        var d = document.createElement('div'); d.className = 'bootfail';
        d.innerHTML = '<b>Waylink didn’t start</b><span></span><button type="button">Reload</button><button type="button" class="ghost">Reset the app’s saved files</button>';
        d.querySelector('span').textContent = msg || 'It took too long to load. Check your connection and try again.';
        d.querySelector('button').onclick = function () { location.reload(); };
        d.querySelector('.ghost').onclick = function () {
          var done = function () { location.reload(); };
          try { (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([])).then(function (r) { r.forEach(function (x) { x.unregister(); }); return window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0; }).then(done, done); } catch (e) { done(); }
        };
        (document.getElementById('app') || document.body).appendChild(d);
      }
      window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && t.tagName !== 'SCRIPT') return; /* fonts and images may fail; only scripts matter */ if (!window.__waylinkReady) fail('Error: ' + (e.message || 'a file failed to load') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '')); }, true);
      window.addEventListener('unhandledrejection', function (e) { if (!window.__waylinkReady) fail('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () { if (!window.__waylinkReady) fail(); }, 8000);
    })();
